[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-detention"
version = "0.1.0"
description = "Act-or-hold case suite, offline controls and audits for the Agent Detention experiments"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pyyaml==6.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_detention = ["suite/*/ATTRIBUTION.md"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
