name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements.txt ruff==0.17.2
          python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check .
      # No datasets and no key: tests that need the suite inputs or the datasets skip, and the live test
      # (tests/routes/test_live.py) runs only with ANTHROPIC_API_KEY and AD_LIVE_SMOKE=1, which CI never sets.
      - name: Tests
        run: python -m pytest -q -rs
